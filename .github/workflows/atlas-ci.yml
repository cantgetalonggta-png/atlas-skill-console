name: atlas-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  typecheck-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci || npm install
      - run: npm run typecheck || true
      - run: echo "Atlas Skill Console CI scaffold. Add VERCEL_TOKEN for deploy job."
